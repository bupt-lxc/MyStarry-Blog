# Included from the existing awards-nginx http context. Keep its other vhosts.
server {
    listen 80;
    server_name xingchenli.top www.xingchenli.top;
    return 301 https://xingchenli.top$request_uri;
}

server {
    listen 443 ssl;
    server_name www.xingchenli.top;
    ssl_certificate /etc/letsencrypt/manual/xingchenli.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/manual/xingchenli.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://xingchenli.top$request_uri;
}

server {
    listen 443 ssl;
    server_name xingchenli.top;
    ssl_certificate /etc/letsencrypt/manual/xingchenli.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/manual/xingchenli.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Resolve at request time so portfolio web can be replaced during releases.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $portfolio_upstream mystarry-web:8080;

    location / {
        proxy_pass http://$portfolio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host xingchenli.top;
        proxy_set_header X-Forwarded-Host xingchenli.top;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Portfolio-Client-IP "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
